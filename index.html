<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5aa6'/%3E%3Cpath d='M18 33l9 9 20-22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>入党知识随机练习</title>
<meta name="description" content="入党知识全题型随机练习：单选、多选、判断、填空、简答、论述。">
<meta property="og:type" content="website">
<meta property="og:title" content="入党知识随机练习">
<meta property="og:description" content="全题型随机抽题，作答后即时查看答案。">
<meta property="og:locale" content="zh_CN">
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #17212b;
  --muted: #6d7785;
  --line: #e2e7ed;
  --accent: #1f5aa6;
  --accent-soft: #edf4fc;
  --accent-strong: #17457e;
  --ok: #187047;
  --ok-soft: #eef9f3;
  --ok-line: #b9e4cd;
  --err: #ad3029;
  --err-soft: #fdf1ef;
  --err-line: #f0c7c2;
  --info-soft: #f7f9fb;
  --shadow: 0 8px 28px rgba(23, 33, 43, .06);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; }
.page {
  width: 100%;
  max-width: 840px;
  margin: 0 auto;
  padding: 26px 18px calc(26px + env(safe-area-inset-bottom));
}
.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin: 0 2px 16px;
}
.title-block { min-width: 0; }
h1 {
  margin: 0;
  font-size: 1.16rem;
  line-height: 1.4;
  letter-spacing: .01em;
  font-weight: 700;
}
.subtitle {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .8rem;
  line-height: 1.5;
}
.counter {
  flex: none;
  margin-top: 1px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: .8rem;
  white-space: nowrap;
}
.card {
  padding: clamp(22px, 4.5vw, 38px);
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.question-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.type-tag {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .76rem;
  font-weight: 700;
  letter-spacing: .03em;
}
.type-hint {
  color: var(--muted);
  font-size: .8rem;
}
.stem {
  margin: 0 0 22px;
  font-size: clamp(1.08rem, 2.2vw, 1.3rem);
  font-weight: 600;
  line-height: 1.8;
  letter-spacing: .005em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.choices {
  display: grid;
  gap: 10px;
}
.option {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 13px 42px 13px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  text-align: left;
  line-height: 1.65;
  cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  overflow-wrap: anywhere;
}
.option:hover:not(:disabled) {
  border-color: #b8c6d8;
  background: #fbfcfe;
}
.option:focus-visible {
  outline: 3px solid rgba(31, 90, 166, .22);
  outline-offset: 2px;
}
.option.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.option:disabled { cursor: default; }
.option-key {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 25px;
  height: 25px;
  margin-top: 1px;
  border-radius: 6px;
  background: #f0f3f6;
  color: #4c5867;
  font-size: .78rem;
  font-weight: 700;
}
.option.selected .option-key {
  background: var(--accent);
  color: #fff;
}
.option.correct {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  box-shadow: inset 0 0 0 1px var(--ok-line);
}
.option.correct .option-key {
  background: var(--ok);
  color: #fff;
}
.option.wrong {
  border-color: var(--err-line);
  background: var(--err-soft);
  box-shadow: inset 0 0 0 1px var(--err-line);
}
.option.wrong .option-key {
  background: var(--err);
  color: #fff;
}
.option.correct::after,
.option.wrong::after {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.05rem;
  font-weight: 700;
}
.option.correct::after { content: "✓"; color: var(--ok); }
.option.wrong::after { content: "✕"; color: var(--err); }
.option-text { min-width: 0; }
.fill-area {
  margin-top: 2px;
}
.fill-input {
  display: block;
  width: 100%;
  min-height: 104px;
  padding: 12px 14px;
  border: 1px solid #ccd5df;
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  line-height: 1.75;
  resize: vertical;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.fill-input::placeholder { color: #98a2ae; }
.fill-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(31, 90, 166, .12);
}
.fill-input:disabled {
  background: #f8fafb;
  color: #526171;
}
.feedback {
  margin-top: 20px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--info-soft);
  font-size: .93rem;
}
.feedback.success {
  border-color: var(--ok-line);
  background: var(--ok-soft);
}
.feedback.error {
  border-color: var(--err-line);
  background: var(--err-soft);
}
.feedback-title {
  margin: 0;
  font-weight: 700;
  font-size: .96rem;
}
.feedback.success .feedback-title { color: var(--ok); }
.feedback.error .feedback-title { color: var(--err); }
.feedback.info .feedback-title { color: var(--text); }
.feedback-line {
  margin-top: 7px;
  overflow-wrap: anywhere;
}
.feedback-line.muted {
  color: var(--muted);
  font-size: .88rem;
}
.feedback-answer {
  margin-top: 7px;
  line-height: 1.85;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.answer-label {
  font-weight: 600;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.btn {
  min-height: 46px;
  padding: 0 24px;
  border: 1px solid transparent;
  border-radius: 9px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.btn:focus-visible {
  outline: 3px solid rgba(31, 90, 166, .22);
  outline-offset: 2px;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn-primary:disabled {
  background: #aab8c9;
  cursor: not-allowed;
}
.btn-secondary {
  border-color: #cbd5e0;
  background: #fff;
  color: var(--text);
}
.btn-secondary:hover { border-color: #a9b7c8; background: #f8fafc; }
.footer {
  margin: 16px 4px 0;
  color: var(--muted);
  text-align: center;
  font-size: .76rem;
  line-height: 1.7;
}
@media (max-width: 620px) {
  .page { padding: 18px 12px calc(20px + env(safe-area-inset-bottom)); }
  .topbar { align-items: flex-start; margin-bottom: 12px; }
  h1 { font-size: 1.05rem; }
  .subtitle { font-size: .76rem; }
  .card { padding: 20px 16px 20px; border-radius: 14px; }
  .stem { margin-bottom: 18px; font-size: 1.08rem; line-height: 1.75; }
  .option { padding: 12px 40px 12px 12px; gap: 10px; }
  .option-key { width: 24px; height: 24px; }
  .feedback { padding: 12px 13px; }
  .actions { gap: 8px; }
  .btn { flex: 1; padding: 0 16px; }
}
@media (max-width: 390px) {
  .topbar { flex-direction: column; gap: 8px; }
  .counter { margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="title-block">
      <h1>入党知识随机练习</h1>
      <p class="subtitle">全题型随机抽题 · 共 <span id="totalCount">2,904</span> 题</p>
    </div>
    <div class="counter" id="counter">已答 0 题</div>
  </header>

  <main class="card" id="card">
    <div class="question-meta">
      <span class="type-tag" id="typeTag">单选题</span>
      <span class="type-hint" id="typeHint">请选择一个选项</span>
    </div>
    <h2 class="stem" id="stem"></h2>

    <div class="choices" id="choiceArea" role="group" aria-label="选项"></div>

    <div class="fill-area" id="fillArea" hidden>
      <textarea class="fill-input" id="fillInput" rows="3" aria-label="填写答案" placeholder="在这里输入你的答案" spellcheck="false"></textarea>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>

    <div class="actions">
      <button class="btn btn-primary" id="submitBtn" type="button" disabled>确认作答</button>
      <button class="btn btn-primary" id="revealBtn" type="button" hidden>显示答案</button>
      <button class="btn btn-secondary" id="nextBtn" type="button" hidden>下一题</button>
    </div>
  </main>

  <footer class="footer">题库已合并重复题目 · 所有题型混合随机抽取</footer>

生活；批评和自我批评"],[3,"锲而不舍落实____精神，抓住 “关键少数” 以上率下，持续深化纠治 “四风”，重点纠治____、官僚主义，坚决破除特权思想和特权行为。","中央八项规定；形式主义"],[3,"二十大党章指出，在习近平新时代中国特色社会主义思想指导下，中国共产党领导全国各族人民，统揽____、伟大工程、____、伟大梦想，推动中国特色社会主义进入了新时代，实现第一个百年奋斗目标，开启了实现第二个百年奋斗目标新征程。","伟大斗争；伟大事业"],[3,"二十大党章指出，广开言路，建立健全____、____、民主决策、民主管理、____的制度和程序。","民主选举；民主协商；民主监督"],[3,"二十大党章要求，弘扬____、坚守理想，践行初心、____，不怕牺牲、英勇斗争，____、不负人民的伟大建党精神。","坚持真理；担当使命；对党忠诚"],[3,"必须按照中国特色社会主义事业____和 “四个全面” 战略布局，统筹推进经济建设、政治建设、文化建设、社会建设、生态文明建设，协调推进____、全面深化改革、全面依法治国、全面从严治党。","“五位一体” 总体布局；全面建设社会主义现代化国家"],[3,"二十大党章要求 “坚持新时代党的组织路线”，全面贯彻习近平新时代中国特色社会主义思想，以组织体系建设为重点，着力培养____的高素质干部，着力集聚爱国奉献的各方面优秀人才。","忠诚干净担当"],[3,"深入推进党风廉政建设和反腐败斗争，以____态度惩治腐败，一体推进____、不能腐、不想腐。","零容忍；不敢腐"],[3,"发展党员，必须把____放在首位，经过党的支部，坚持____的原则。","政治标准；个别吸收"],[3,"每个党员，不论____高低，都必须编入党的一个____、小组或其他特定组织，参加党的____，接受党内外群众的监督。","职务；支部；组织生活"],[3,"党员____，不履行____，不符合党员条件，党的支部应当对他进行教育，要求他限期改正；经教育仍无转变的，应当劝他____。","缺乏革命意志；党员义务；退党"],[3,"企业、农村、机关、学校、医院、科研院所、街道社区、社会组织、人民解放军连队和其他____单位，凡是有正式党员____以上的，都应当成立党的基层组织。","基层；三人"],[3,"中国共产党的____是中国共产党的象征和标志。","党徽党旗"],[4,"简述党的十九届五中全会中提出的到2035年要基本实现的社会主义现代化远景目标。","我国经济实力、科技实力、综合国力将大幅跃升，经济总量和城乡居民人均收入将再迈上新的大台阶，关键核心技术实现重大突破，进入创新型国家前列；基本实现新型工业化、信息化、城镇化、农业现代化，建成现代化经济体系；基本实现国家治理体系和治理能力现代化，人民平等参与、平等发展权利得到充分保障，基本建成法治国家、法治政府、法治社会；建成文化强国、教育强国、人才强国、体育强国、健康中国，国民素质和社会文明程度达到新高度，国家文化软实力显著增强；广泛形成绿色生产生活方式，碳排放达峰后稳中有降，生态环境根本好转，美丽中国建设目标基本实现；形成对外开放新格局，参与国际经济合作和竞争新优势明显增强；人均国内生产总值达到中等发达国家水平，中等收入群体显著扩大，基本公共服务实现均等化，城乡区域发展差距和居民生活水平差距显著缩小；平安中国建设达到更高水平，基本实现国防和军队现代化；人民生活更加美好，人的全面发展、全体人民共同富裕取得更为明显的实质性进展。"],[4,"党章规定，党的全国代表大会的职权是？","1.听取和审查中央委员会的报告；2.审查中央纪律检查委员会的报告；3.讨论并决定党的重大问题；4.修改党的章程；5.选举中央委员会；6.选举中央纪律检查委员会。"],[4,"进一步全面深化改革的原则是什么？","1.坚持党的全面领导。2.坚持以制度建设为主线3.坚持以人民为中心。4.坚持全面依法治国。5.坚持守正创新。6.坚持系统观念。"],[4,"七个“聚焦”是什么？","1.聚焦构建高水平社会主义市场经济体制。2.聚焦发展全过程人民民主。3.聚焦建设社会主义文化强国。4.聚焦提高人民生活品质。5.聚焦建设美丽中国。6.聚焦建设更高水平平安中国。7.聚焦提高党的领导水平和长期执政能力。"],[4,"二〇三五年远景目标是什么？","1.全面建成高水平社会主义市场经济体制。2.中国特色社会主义制度更加完善。3.基本实现国家治理体系和治理能力现代化。4.基本实现社会主义现代化。5.为到本世纪中叶全面建成社会主义现代化强国奠定坚实基础。"],[4,"请简述党的中央委员会开展工作的原则。","1.坚持党对一切工作的领导，确保党中央集中统一领导。2.坚持和发展中国特色社会主义，全面贯彻党的基本理论、基本路线、基本方略。3.坚持解放思想，实事求是，与时俱进，求真务实。4.坚持全心全意为人民服务，以人民为中心，为人民执政、靠人民执政。5.坚持民主集中制，充分发扬党内民主，实行正确有效集中，维护党的团结统一。6.坚持从严管党治党，永葆党的先进性和纯洁性。"],[4,"简述党的政治纪律和政治规矩中要坚持的“五个必须”。","1.必须维护党中央权威，决不允许背离党中央要求另搞一套。2.必须维护党的团结，决不允许在党内培植个人势力。3.必须遵循组织程序，决不允许擅作主张、我行我素。4.必须服从组织决定，决不允许搞非组织活动。5.必须管好领导干部亲属和身边工作人员，决不允许他们擅权干政、谋取私利。"],[4,"请简述新时代党的建设总要求。","坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。"],[4,"党的各级纪律检查委员会是党内监督专责机关，请简述其主要任务。","维护党的章程和其他党内法规，检查党的路线、方针、政策和决议的执行情况，协助党的委员会推进全面从严治党、加强党风建设和组织协调反腐败工作。"],[4,"党员应当本着对党和人民事业高度负责的态度，积极行使党员权利，应履行哪些监督义务？","1.加强对党的领导干部的民主监督，及时向党组织反映群众意见和诉求。2.在党的会议上有根据地批评党的任何组织和任何党员，揭露和纠正工作中存在的缺点和问题。3.参加党组织开展的评议领导干部活动，勇于触及矛盾问题、指出缺点错误，对错误言行敢于较真、敢于斗争。4.向党负责地揭发、检举党的任何组织和任何党员违纪违法的事实，坚决反对一切派别活动和小集团活动，同腐败现象作坚决斗争。"],[4,"请简述党支部的职责。","党支部是党的基础组织，是党组织开展工作的基本单元，是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础，担负直接教育党员、管理党员、监督党员和组织群众、宣传群众、凝聚群众、服务群众的职责。"],[4,"请简述新时代党的组织路线。","全面贯彻习近平新时代中国特色社会主义思想，以组织体系建设为重点，着力培养忠诚干净担当的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人唯贤，为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。"],[4,"请简述党的二十大报告中指出中国共产党需要在哪些方面领导人民发展社会主义。","1.中国共产党领导人民发展社会主义民主政治。2.中国共产党领导人民发展社会主义先进文化。3.中国共产党领导人民构建社会主义和谐社会。4.中国共产党领导人民建设社会主义生态文明。"],[4,"请简述党的规矩的内容。","1.党章是全党必须遵循的总章程，也是总规矩。2.党的纪律是刚性约束，政治纪律是全党在政治方向、政治立场、政治言论、政治行动方面必须遵守的规矩。3.国家法律是党员干部必须遵守的规矩，法律是党领导人民制定的，全党必须模范执行。4.党在长期实践中形成的优良传统和工作惯例，经过实践检验，约定俗成、行之有效，需要全党长期坚持并自觉遵循。"],[4,"请简述党的六大纪律。","政治纪律，组织纪律，廉洁纪律，群众纪律，工作纪律，生活纪律。其中最重要的、最根本的、最关键的是政治纪律，遵守党的政治纪律是遵守党的全部纪律的重要基础。"],[4,"请简述四讲四有、四个合格的内容","1.讲政治、有信念，坚定理想信念，做到政治合格。2.讲规矩、有纪律，恪守党章党规，做到守纪合格。3.讲道德、有品行，加强道德修养，做到品德合格。4.讲奉献、有作为，勤勉担当尽责，做到履责合格。"],[4,"请从五个方面阐述中国特色社会主义道路的内涵。","1.党的领导是前提。中国特色社会主义道路是中国共产党领导人民长期探索，奋力开拓的道路。2.基本国情是基础。中国特色社会主义是建立在中国现实基础之上的社会主义。3.经济建设是中心。以经济建设为中心是兴国之要，是我们党、我们国家兴旺发达和长治久安的根本要求。4.四项基本原则和改革开放是两个基本点。5.全面发展是总体目标。解放和发展社会生产力，巩固和发展社会主义制度，建设社会主义市场经济、社会主义民主政治、社会主义先进文化、社会主义和谐社会、社会主义生态文明，促进人的全面发展，逐步实现全体人民共同富裕，最终建成富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。"],[4,"党的十九届六中全会中，《中共中央关于党的百年奋斗重大成就和历史经验的决议》提出了四个历史时期的伟大飞跃，请简要回答它们都是在哪一历史时期实现的何种伟大飞跃。","1.新民主主义革命时期，实现了中国从几千年封建专制政治向人民民主的伟大飞跃。2.社会主义革命和建设时期，实现了一穷二白、人口众多的东方大国大步迈进社会主义社会的伟大飞跃。3.改革开放和社会主义现代化建设新时期，推进了中华民族从站起来到富起来的伟大飞跃。4.中国特色社会主义新时代，中华民族迎来了从站起来、富起来到强起来的伟大飞跃。"],[4,"进一步全面深化改革的指导思想是什么？","1.坚持马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观。2.全面贯彻习近平新时代中国特色社会主义思想。3.深入学习贯彻习近平总书记关于全面深化改革的一系列新思想、新观点、新论断。4.完整准确全面贯彻新发展理念。5.更加注重系统集成，突出重点，改革实效。"],[4,"党的十九届六中全会中，提出了中国共产党百年奋斗的“四个伟大成就”，请对此“四个伟大成就”进行简要叙述。","1.党领导人民浴血奋战、百折不挠，创造了新民主主义革命的伟大成就。2.党领导人民自力更生、发愤图强，创造了社会主义革命和建设的伟大成就。3.党领导人民解放思想、锐意进取，创造了改革开放和社会主义现代化建设的伟大成就。4.党领导人民自信自强、守正创新，创造了新时代中国特色社会主义的伟大成就。"],[4,"党的二十大报告指出，在过去的十年里我们经历了对党和人民事业具有重大现实意义和深远历史意义的“三件大事”，请对此“三件大事”进行简要叙述。","1.迎来中国共产党成立一百周年。2.中国特色社会主义进入新时代。3.完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。这三件事是中国共产党和中国人民团结奋斗赢得的历史性胜利，是彪炳中华民族发展史册的历史性胜利，也是对世界具有深远影响的历史性胜利。"],[4,"党的二十大报告提出了从现在起中国共产党的中心任务，请简要阐述。","从现在起，中国共产党的中心任务就是，团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"],[4,"党的二十大报告指出，全面建设社会主义现代化国家，是一项伟大而艰巨的事业，前进道路上必须牢牢把握“五个重大原则”，请对“五个重大原则”简要阐述。","1.坚持和加强党的全面领导。2.坚持中国特色社会主义道路。3.坚持以人民为中心的发展思想。4.坚持深化改革开放。5.坚持发扬斗争精神。"],[4,"党的二十大报告提出，以中国式现代化全面推进中华民族伟大复兴。中国式现代化有丰富的内涵，请简要阐述。","中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。中国式现代化，是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协调的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。"],[4,"请根据《中国共产党党员教育管理工作条例》，简述党员教育管理的首要政治任务是什么？","把用习近平新时代中国特色社会主义思想武装全党作为党员教育管理的首要政治任务，引导党员充分认识学习贯彻习近平新时代中国特色社会主义思想的重大意义，自觉学懂弄通做实。"],[4,"党的思想路线的基本内容是什么？","一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理，是党认识世界和改造世界的根本思想方法。"],[4,"“两个一百年”奋斗目标中，第一个百年奋斗目标已实现，第二个百年奋斗目标分哪两个阶段？","第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化；第二个阶段，从2035年到本世纪中叶，在基本实现现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国。"],[4,"全面依法治国的总目标是什么？","建设中国特色社会主义法治体系，建设社会主义法治国家，坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设。"],[4,"党的组织原则是什么？","民主集中制，即民主基础上的集中和集中指导下的民主相结合，是党的根本组织原则和领导制度。"],[4,"党的二十大报告指出，全面从严治党的战略方针必须长期坚持，其核心要求是什么？","坚持和加强党中央集中统一领导，坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，完善党的自我革命制度规范体系，建设堪当民族复兴重任的高素质干部队伍，增强党组织政治功能和组织功能，坚持以严的基调强化正风肃纪，坚决打赢反腐败斗争攻坚战持久战。"],[4,"中央八项规定的核心内容集中在哪些方面？","1.改进调查研究。2.精简会议活动。3.精简文件简报。4.规范出访活动。5.改进警卫工作。6.改进新闻报道。7.严格文稿发表。8.厉行勤俭节约。"],[4,"党的纪律教育的核心目标是什么？","党的纪律教育核心目标是引导党员干部增强纪律意识、规矩意识，自觉学习党章党规党纪，熟知党的政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律的具体要求，做到知敬畏、存戒惧、守底线，始终在思想上政治上行动上同党中央保持高度一致，确保党的纪律规矩得到严格遵守和执行。"],[4,"新时代持续深化落实中央八项规定精神的重点方向是什么？","紧盯“四风”隐形变异、翻新升级问题，严肃整治形式主义、官僚主义；严查享乐主义、奢靡之风，如违规吃喝、违规收送礼品礼金、违规发放津补贴等；健全长效机制，将作风建设融入日常监督管理，推动化风成俗、形成习惯；强化责任落实，督促各级党组织扛起作风建设主体责任，以严的基调持续纠治作风问题。"],[4,"《中国共产党纪律处分条例》中，对党员受到警告或者严重警告处分的，在任职和晋升方面有何规定？","党员受到警告处分一年内、受到严重警告处分一年半内，不得在党内提升职务和向党外组织推荐担任高于其原任职务的党外职务。"],[4,"开展党的纪律教育，应重点突出哪些纪律内容的学习？","应重点突出政治纪律学习，确保党员干部坚决维护党中央权威和集中统一领导；突出组织纪律学习，强化党员干部的组织观念和服从意识；突出廉洁纪律学习，引导党员干部坚守廉洁从政底线；突出群众纪律学习，督促党员干部践行以人民为中心的发展思想；突出工作纪律学习，推动党员干部认真履职尽责；突出生活纪律学习，培养党员干部健康向上的生活作风。"],[4,"党员干部在遵守廉洁纪律方面，应坚决杜绝哪些行为？","应坚决杜绝利用职权或职务上的影响为本人或他人谋取利益；杜绝收受可能影响公正执行公务的礼品、礼金、消费卡和有价证券等财物；杜绝违规从事营利活动，如经商办企业、拥有非上市公司股份等；杜绝利用职权或职务影响为亲属和身边工作人员谋取特殊利益；杜绝违规干预和插手市场经济活动、司法活动、执纪执法活动等。"],[4,"党的纪律教育的主要方式有哪些？","将纪律教育纳入党员干部教育培训体系，作为必修课程；开展专题纪律学习研讨，结合典型案例进行警示教育；组织参观廉政教育基地、观看警示教育片，增强教育的直观性和感染力；运用“三会一课”、主题党日活动，常态化开展纪律教育；通过谈心谈话、廉政谈话，对党员干部进行日常纪律提醒。"],[4,"中央八项规定中，关于“改进调查研究”提出了哪些具体要求？","要求中央领导同志到基层调研要深入了解真实情况，总结经验、研究问题、解决困难、指导工作；要轻车简从、减少陪同、简化接待，不张贴悬挂标语横幅，不安排群众迎送，不铺设迎宾地毯，不摆放花草，不安排宴请。"],[4,"新时代加强党的纪律建设，为何要把政治纪律摆在首位？","因为政治纪律是党的生命线，是维护党的团结统一和党中央权威的根本保证。在党的各项纪律中，政治纪律决定着党的纪律建设的方向，只有把政治纪律摆在首位，才能确保党员干部在政治立场、政治方向、政治原则、政治道路上同党中央保持高度一致；才能防范和纠正一切偏离“两个维护”的错误言行，确保党的路线方针政策得到不折不扣的执行，为党的事业发展提供坚强政治保障。"],[4,"中央八项规定中，针对“精简会议活动”明确了哪些措施？","严格控制以中央名义召开的全国性会议和举行的重大活动，不开泛泛部署工作和提要求的会；未经中央批准，各地、各部门不得举行全国性会议和重大活动；会议要压缩会期，提高效率，能合并的合并召开；严格控制会议经费，严禁铺张浪费。"],[4,"党员干部遵守工作纪律，应做到哪些基本要求？","认真履行工作职责，不消极怠工、敷衍塞责；严格遵守工作程序和规章制度，不擅作主张、越权行事；保守工作秘密，不泄露党和国家的机密；在工作中不搞弄虚作假、虚报浮夸，不做表面文章；积极配合协作，不搞本位主义，确保工作高效推进。"],[4,"党的纪律处分中，“撤销党内职务”处分的适用情形是什么？","适用于党员所犯错误性质、情节较重，不适合继续担任党内职务的情况。对于在党内担任两个以上职务的，党组织在作处分决定时，应当明确是撤销其一切职务还是某个职务。如果决定撤销其某个职务，必须撤销其担任的最高职务；如果决定撤销其两个以上职务，必须从其担任的最高职务开始依次撤销。"],[4,"中央八项规定实施后，针对“文山会海”问题，采取了哪些整治措施？","严格控制文件数量和篇幅，杜绝重复发文、无效发文；推行文件电子化传输，减少纸质文件印发；严格控制会议数量，能通过电话、视频会议解决的不开现场会议；压缩会议时间，提高会议效率，避免议而不决；规范会议形式，减少不必要的参会人员，避免层层陪会。"],[4,"党员受到留党察看处分，期间享有哪些权利、需遵守哪些要求？","党员受到留党察看处分期间，没有表决权、选举权和被选举权；留党察看期限一般为1年，最长不超过2年，从处分决定生效之日起计算；受处分期间，党员需认真改正错误，积极参加组织生活和学习，定期向党组织汇报思想和整改情况；期满后，党组织需对其表现进行考察，符合条件的恢复党员权利，不符合条件的可延长留党察看期限（延长期限不得少于6个月，且累计不超过2年），仍不符合条件的给予开除党籍处分。"],[4,"简述党的纪律检查机关的主要职责。","维护党的章程和其他党内法规，检查党的路线、方针、政策和决议的执行情况；开展纪律教育，组织学习党的纪律规定和典型案例，增强党员干部纪律意识；受理对党组织和党员干部违反党纪行为的检举、控告，按权限查处违纪问题，作出纪律处分决定；对党组织和党员干部执行纪律情况进行日常监督，通过谈心谈话、检查考核等方式督促纪律落实；受理党员的申诉，保障党员的合法权利，监督处分决定的执行情况；协助党委推进全面从严治党、加强党风建设和组织协调反腐败工作。"],[4,"中央八项规定实施后，针对“公务接待”中的突出问题，采取了哪些整治措施？","明确公务接待清单制度，接待需如实记录接待对象、人数、时间、地点、费用等，无清单不得报销；严格控制陪餐人数，接待对象在10人以内的，陪餐人数不得超过3人，超过10人的陪餐人数不得超过接待对象人数的1/3；限定用餐标准，不得超标准安排用餐，禁止提供鱼翅、燕窝等高档菜肴和野生保护动物制品，工作日中午和公务活动期间严禁饮酒；规范接待场所，不得在私人会所、高消费餐饮场所安排公务接待；严禁转嫁接待费用，不得将公务接待费用摊派给下属单位、企业或个人。"],[4,"党员受到“开除党籍”处分，会产生哪些后果？","党员被开除党籍后，不再享有党员的各项权利，也无需履行党员义务，其党籍从处分决定生效之日起终止；5年内不得重新入党，如涉及故意犯罪被依法判处刑法规定的主刑（含宣告缓刑）、被单处或者附加剥夺政治权利，或因过失犯罪被依法判处3年以上（不含3年）有期徒刑的，终身不得重新入党；受处分前担任的党内职务自动撤销，向党外组织推荐担任的党外职务，需按规定建议党外组织撤销；处分决定需存入本人档案，作为其政治表现的重要依据，影响其后续职务晋升、评优评先等；如同时涉嫌违法犯罪，需将问题线索移送司法机关，依法追究法律责任。"],[4,"中央八项规定中，关于“厉行勤俭节约”明确了哪些具体措施？","严格控制公务用车配备和使用，优先使用新能源汽车，严禁公车私用、私车公养；规范公务用房管理，超标办公用房需按规定清理腾退，严禁违规装修、超标准配置办公家具；压缩公务接待费用，严格执行接待标准，禁止超范围、超标准接待，不得提供高档菜肴和酒水；减少一次性用品使用，推行无纸化办公，倡导节约水电、纸张等资源；严禁借节日、庆典等名义发放津贴、补贴、奖金或实物，杜绝铺张浪费。"],[4,"党员干部遵守组织纪律，在“请示报告”方面需做到哪些要求？","重大事项必须按规定向党组织请示报告，如个人重大疾病、婚姻变化、子女经商办企业等，不得隐瞒不报、漏报、迟报；工作中涉及重要决策、重大项目安排等，需按权限和程序请示，未经批准不得擅自决定；离开工作岗位或工作地（如出差、休假、探亲），需按规定向所在党组织或领导请假，说明去向、时间和联系方式；在境外学习、工作、生活期间，需定期向党组织汇报思想和情况，不得脱离组织监督；领导干部需按规定报告个人有关事项，内容真实、完整，接受组织审核。"],[4,"党的二十届四中全会提出 “十五五” 时期经济社会发展必须遵循的原则有哪些？","党的二十届四中全会提出，“十五五” 时期经济社会发展必须遵循以下原则：坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全。"],[4,"党的二十大报告提出的“六个必须坚持”具体指什么？","“六个必须坚持” 是党的二十大报告的一个重大理论贡献，既是对习近平新时代中国特色社会主义思想世界观和方法论的高度凝练、科学概括，也是继续推进实践基础上的理论创新、不断谱写马克思主义中国化时代化新篇章的根本遵循。具体包括：必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。"],[4,"中国共产党百年奋斗积累的宝贵历史经验有哪些？","中国共产党百年奋斗积累的宝贵历史经验包括：坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争、坚持统一战线、坚持自我革命。"],[4,"二十大党章规定的党员义务有哪些？","二十大党章第三条规定，党员必须履行下列义务：\n（一）认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表” 重要思想、科学发展观、习近平新时代中国特色社会主义思想，学习党的路线、方针、政策和决议，学习党的基本知识和党的历史，学习科学、文化、法律和业务知识，努力提高为人民服务的本领。\n（二）增强 “四个意识”、坚定 “四个自信”、做到 “两个维护”，贯彻执行党的基本路线和各项方针、政策，带头参加改革开放和社会主义现代化建设，带动群众为经济发展和社会进步艰苦奋斗，在生产、工作、学习和社会生活中起先锋模范作用。\n（三）坚持党和人民的利益高于一切，个人利益服从党和人民的利益，吃苦在前，享受在后，克己奉公，多做贡献。\n（四）自觉遵守党的纪律，首先是党的政治纪律和政治规矩，模范遵守国家的法律法规，严格保守党和国家的秘密，执行党的决定，服从组织分配，积极完成党的任务。\n（五）维护党的团结和统一，对党忠诚老实，言行一致，坚决反对一切派别组织和小集团活动，反对阳奉阴违的两面派行为和一切阴谋诡计。\n（六）切实开展批评和自我批评，勇于揭露和纠正违反党的原则的言行和工作中的缺点、错误，坚决同消极腐败现象作斗争。\n（七）密切联系群众，向群众宣传党的主张，遇事同群众商量，及时向党反映群众的意见和要求，维护群众的正当利益。\n（八）发扬社会主义新风尚，带头实践社会主义核心价值观和社会主义荣辱观，提倡共产主义道德，弘扬中华民族传统美德，为了保护国家和人民的利益，在一切困难和危险的时刻挺身而出，英勇斗争，不怕牺牲。"],[4,"二十大党章规定的党员权利有哪些？","二十大党章第四条规定，党员享有下列权利：\n（一）参加党的有关会议，阅读党的有关文件，接受党的教育和培训。\n（二）在党的会议上和党报党刊上，参加关于党的政策问题的讨论。\n（三）对党的工作提出建议和倡议。\n（四）在党的会议上有根据地批评党的任何组织和任何党员，向党负责地揭发、检举党的任何组织和任何党员违法乱纪的事实，要求处分违法乱纪的党员，要求罢免或撤换不称职的干部。\n（五）行使表决权、选举权，有被选举权。\n（六）在党组织讨论决定对党员的党纪处分或作出鉴定时，本人有权参加和进行申辩，其他党员可以为他作证和辩护。\n（七）对党的决议和政策如有不同意见，在坚决执行的前提下，可以声明保留，并且可以把自己的意见向党的上级组织直至中央提出。\n（八）向党的上级组织直至中央提出请求、申诉和控告，并要求有关组织给以负责的答复。"],[4,"预备党员面向党旗进行入党宣誓时所宣读的誓词是什么？","预备党员必须面向党旗进行入党宣誓。誓词如下：我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。"],[4,"党的十九大报告中“十个明确”的主要内容有哪些？","一是明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量，全党必须增强“四个意识”、坚定“四个自信”、做到“两个维护”。\n二是明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。\n三是明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更明显的实质性进展。\n四是明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面。\n五是明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。\n六是明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。\n七是明确必须坚持和完善社会主义基本经济制度，使话场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全。\n八是明确党在新时代的强军目标是建设一支听觉指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。\n九是明确中国特色大国外交要服务民族复兴、促进人类进步，推动建设新型国际关系，推动构建人类命运共同体。\n十是明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命。"],[4,"党的十九大报告中“十四个坚持”的主要内容有哪些？","坚持党对一切工作的领导，坚持以人民为中心，坚持全面深化改革，坚持新发展理念，坚持人民当家作主，坚持全面依法治国，坚持社会主义核心价值体系，坚持在发展中保障和改善民生，坚持人与自然和谐共生，坚持总体国家安全观，坚持党对人民军队的绝对领导，坚持“一国两制”和推进祖国统一，坚持推动构建人类命运共同体，坚持全面从严治党。"],[4,"党的十九届六中全会报告中“十三个方面成就”的主要内容有哪些？","“十三个方面成就”是党的十九届六中全会从13个方面，即在坚持党的全面领导上、在全面从严治党上、在经济建设上、在全面深化改革开放上、在政治建设上、在全面依法治国上、在文化建设上、在社会建设上、在生态文明建设上、在国防和军队建设上、在维护国家安全上、在坚持“一国两制”和推进祖国统一上和在外交工作上，深刻总结党的十八大以来党和国家事业取得的历史性成就、发生的历史性变革。党的十九届六中全会《决议》指出：\n“以习近平同志为核心的党中央，以伟大的历史主动精神、巨大的政治勇气、强烈的责任担当，统筹国内国际两个大局，贯彻党的基本理论、基本路线、基本方略，统揽伟大斗争、伟大工程、伟大事业、伟大梦想，坚持稳中求进工作总基调，出台一系列重大方针政策，推出一系列重大举措，推进一系列重大工作，战胜一系列重大风险挑战，解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，推动党和国家事业取得历史性成就、发生历史性变革。”"],[4,"中国共产党在社会主义初级阶段的基本路线和纲领是什么？","基本路线是：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。\n党在社会主义初级阶段的基本纲领就是党在社会主义初级阶段的基本路线在经济、政治、文化、社会、生态文明等方面的展开，是建设有中国特色社会主义的基本目标和基本政策，即中国特色社会主义事业总体布局。"],[4,"民主集中制必须遵循哪些基本原则？","党的民主集中制的基本原则是：\n（1）党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。\n（2）党的各级领导机关，除它们派出的代表机关和在非党组织中的党组外，都由选举产生。\n（3）党的最高领导机关，是党的全国代表大会和它所产生的中央委员会。党的地方各级领导机关，是党的地方各级代表大会和它们所产生的委员会。党的各级委员会向同级的代表大会负责并报告工作。\n（4）党的上级组织要经常听取下级组织和党员群众的意见，及时解决他们提出的问题。党的下级组织既要向上级组织请示和报告工作，又要独立负责地解决自己职责范围内的问题。上下级组织之间要互通情报、互相支持和互相监督。党的各级组织要按规定实行党务公开，使党员对党内事务有更多的了解和参与。\n（5）党的各级委员会实行集体领导和个人分工负责相结合的制度。凡属重大问题都要按照集体领导、民主集中、个别酝酿、会议决定的原则，由党的委员会集体讨论，作出决定；委员会成员要根据集体的决定和分工，切实履行自己的职责。\n（6）党禁止任何形式的个人崇拜。要保证党的领导人的活动处于党和人民的监督之下，同时维护一切代表党和人民利益的领导人的威信。"],[4,"成为发展对象的必要条件是什么？主要程序是什么？","必要条件：\n从主体来说，必须是入党积极分子；\n从培养教育时间上来说，入党积极分子必须经过党组织一年以上的培养教育和考察。除极个别特殊情况，经上级党组织批准外，凡培养教育时向不满一年的，一般不能确定发展对象；\n从成熟程度来说，应该是基本具备了党章规定的党员条件，党内外群众反映较好，可以履行入党手续的人党积极分子，顺利完成了党组织设计的一年以上的培养教育科目，并通过了党组织的考察；\n从思想上来说，要有坚定的政治立场，不能动摇对党忠诚的信念。\n经一年以上培养教育的人党积极分子，按照下列程序可确定为发展对象：\n1.党小组建议。\n2.征求群众意见。\n3.支委会讨论确定。\n4.上级党组织预审。\n外单位转入的入党积极分子，在原单位已经过一年以上的培养教育，接收单位的党支部经过全面考察，确认其已具备党员条件时，可列为发展对象。"],[4,"入党介绍人的条件和主要任务是什么？确定入党介绍人的途径有哪些？","条件：\n人党介绍人必须由两名党员担任。\n入党介绍人要由正式党员担任。\n任务：\n向发展对象解释党的纲领、章程，说明党员的条件、义务和权利；\n认真了解发展对象的入党动机、政治觉悟、道德品质、工作经历、现实表现等情况，如实向党组织汇报；\n指导发展对象填写《中国共产党入党志愿书》，并认真填写自己的意见；\n向支部大会负责地介绍发展对象的情况；\n发展对象批准为预备党员后，继续对其进行教育帮助。\n途径：\n人党介绍人一般由培养联系人担任。\n入党介绍人也可以由党组织指定，党组织指定的人党介绍人必须经过他们本人同意。"],[4,"政治审查的基本内容和基本途径分别是什么？","基本内容：\n发展对象对党的十一届三中全会以来党的理论和路线、方针、政策的态度；\n发展对象的政治历史和在重大政治斗争中的表现；\n遵纪守法和遵守社会公德的情况；\n直系亲属和与本人关系密切的主要社会关系的政治情况。\n主要途径：\n查阅本人人事档案和有关材料；\n同本人谈话，了解核实有关情况；\n找有关单位或人员了解情况；\n函调或外调；\n形成结论性政审材料。"],[4,"结论性政审包含哪些内容？","（1）发展对象本人的简历及直系亲属、主要社会关系情况。\n（2）政审中提出的问题。包括问题发生的时间、地点和主要情节以及组织上是否作过结论。同时，还应该表明是本人主动说清的，还是组织调查出来或他人检举的。\n（3）调查的结果。写明经调查已清楚的问题，以及悬而未定的问题和\n疑点。\n（4）结论意见。对查证经过综合分析后，认定查证问题的事实、性质、程度及本人认识，提出是否影响发展对象入党的结论性意见。除特殊情况外，政治审查结果在一年内有效。凡不经过政治审查或政治审查不合格的，不能发展入党。"],[4,"发展对象短期集中培训的内容是什么？","党的基本理论、基本路线，基本方略和基本知识，党的优良传统和作风以及其他有关知识，学习的文件和材料主要是党的二十大报告、《中国共产党章程》、《关于新形势下党内政治生活的若干准则》、《中国共产党党内监督条例》、《中国共产党纪律处分条例》及中央组织部组织编写的《入党教材》等。"],[5,"根据党章的内容，分析中国共产党成功的原因。",""],[5,"如何理解全面从严治党在“四个全面”战略布局中的地位与作用？",""],[5,"请结合自身实际谈谈如何践行社会主义核心价值观。",""],[5,"按照《关于党内政治生活的若干准则》的要求，如何正确对待犯错误的同志？",""],[5,"试论述中国共产党为什么以马克思主义为行动指南？",""],[5,"全面从严治党提出的背景与内涵是什么？",""],[5,"试述实施社会主义核心价值观的重大意义。",""],[5,"《关于党内政治生活的若干准则》的主要内容是什么？",""],[5,"如何认识新时代全面深化改革的重大成就？",""],[5,"试论习近平新时代中国特色社会主义思想的内涵。",""],[5,"试论习近平新时代中国特色社会主义思想的理论地位。",""],[5,"请对照《关于新形势下党内政治生活的若干准则》，谈谈你打算如何提高党性修养？",""],[5,"请对照《关于新形势下党内政治生活的若干准则》，谈谈如何开展批评和自我批评？",""],[5,"谈谈社会主义核心价值观与文化自信之间的关系",""],[5,"谈谈对当今中国历史方位的认识？",""],[5,"结合二十大报告，谈一谈如何健全党和国家监督体系？",""],[5,"党章修正案增写培育和践行社会主义核心价值观的内容意义何在？",""],[5,"谈谈在新形势下坚持党的基本路线的重大意义和途径",""],[5,"请紧密结合习近平总书记2017年5月3日来校视察时重要讲话精神和授课专题内容，谈谈对“青年成长成才表率标准”的认识和理解。",""],[5,"简述开展“不忘初心 牢记使命”主题教育的重大意义。",""],[5,"结合中国共产党成立100周年的光辉历程及所取得的伟大成就，谈谈你从中获得的启示。",""],[5,"请根据《中国共产党党员教育管理工作条例》，简述如何成为习近平新时代中国特色社会主义思想坚定信仰者和忠实实践者？",""],[5,"结合自身经历谈谈如何深入学习理解中央八项规定。",""],[5,"请结合学习生活经验，论述“十四五”时期经济社会发展为什么必须遵循坚持以人民为中心的原则？",""],[5,"请结合学习生活经验，论述“十四五”时期经济社会发展为什么必须遵循坚持党的全面领导的原则？",""],[5,"为什么进一步全面深化改革要做到“三个更加注重”？",""],[5,"为什么说当前和今后一个时期我国已转向高质量发展阶段，同时我国发展不平衡不充分问题仍然突出？",""],[5,"习近平总书记强调，国家安全工作是党治国理政一项十分重要的工作，也是保障国泰民安一项十分重要的工作，请简述应如何贯彻总体国家观？",""],[5,"如何理解完善推进法治社会建设机制？",""],[5,"请结合学习生活经验，简述社会主义核心价值观的主要特征。",""],[5,"如何理解把握习近平总书记关于全面深化改革的一系列新思想、新观点、新论断？",""],[5,"结合自身经历，谈谈法大学子应如何践行长征精神。",""],[5,"谈谈如何在学习科研、社会实践和校园生活中践行党的宗旨，发挥先锋模范作用？",""],[5,"为什么说习近平新时代中国特色社会主义思想实现了马克思主义中国化新的飞跃？",""],[5,"如何理解坚持党的领导是我们党百年奋斗的历史经验？",""],[5,"党的十八大以来，以习近平总书记为核心的党中央领导集体领导和团结各族人民，取得了全面建成小康社会的历史性成果。请结合两个百年奋斗目标，谈一谈为什么只有中国共产党能领导中国人民实现中华民族伟大复兴的中国梦？",""],[5,"全面从严治党永远在路上，党的自我革命永远在路上。请结合二十大报告，谈一谈新时代全面从严治党的举措和意义。",""],[5,"中国式现代化，是中国共产党领导的社会主义现代化。请结合习近平新时代中国特色社会主义思想与二十大报告，谈一谈中国式现代化的特征。",""]]</script>
<script>
(function () {
  'use strict';

  var BANK;
  try {
    BANK = JSON.parse(document.getElementById('bankData').textContent);
  } catch (e) {
    document.getElementById('stem').textContent = '题库加载失败，请刷新页面后重试。';
    return;
  }

  var LETTERS = 'ABCDEFGH';
  var TYPES = {
    0: { label: '单选题', hint: '请选择一个选项' },
    1: { label: '多选题', hint: '可选择多个选项' },
    2: { label: '判断题', hint: '请判断正误' },
    3: { label: '填空题', hint: '填写答案后点击确认' },
    4: { label: '简答题', hint: '无需作答，点击“显示答案”' },
    5: { label: '论述题', hint: '无需作答，点击“显示答案”' }
  };

  var typeTag = document.getElementById('typeTag');
  var typeHint = document.getElementById('typeHint');
  var stemEl = document.getElementById('stem');
  var choiceArea = document.getElementById('choiceArea');
  var fillArea = document.getElementById('fillArea');
  var fillInput = document.getElementById('fillInput');
  var feedback = document.getElementById('feedback');
  var submitBtn = document.getElementById('submitBtn');
  var revealBtn = document.getElementById('revealBtn');
  var nextBtn = document.getElementById('nextBtn');
  var counterEl = document.getElementById('counter');
  var totalCountEl = document.getElementById('totalCount');

  var queue = [];
  var current = null;
  var currentIndex = -1;
  var selected = new Set();
  var optionButtons = [];
  var locked = true;
  var completed = 0;
  var completedThis = false;

  totalCountEl.textContent = BANK.length.toLocaleString('zh-CN');

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
    }
    return list;
  }

  function drawQuestion() {
    if (!queue.length) {
      queue = BANK.map(function (_, i) { return i; });
      shuffle(queue);
      if (queue.length > 1 && queue[queue.length - 1] === currentIndex) {
        var first = queue[0];
        queue[0] = queue[queue.length - 1];
        queue[queue.length - 1] = first;
      }
    }
    currentIndex = queue.pop();
    current = BANK[currentIndex];
    renderQuestion();
  }

  function resetFeedback() {
    feedback.hidden = true;
    feedback.className = 'feedback';
    feedback.replaceChildren();
  }

  function makeChoiceButtons(options) {
    choiceArea.replaceChildren();
    optionButtons = [];
    options.forEach(function (text, index) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'option';
      button.setAttribute('aria-pressed', 'false');

      var key = document.createElement('span');
      key.className = 'option-key';
      key.textContent = LETTERS.charAt(index);

      var label = document.createElement('span');
      label.className = 'option-text';
      label.textContent = text;

      button.appendChild(key);
      button.appendChild(label);
      button.addEventListener('click', function () { chooseOption(index); });
      optionButtons.push(button);
      choiceArea.appendChild(button);
    });
  }

  function renderQuestion() {
    var type = current[0];
    var meta = TYPES[type];
    locked = false;
    completedThis = false;
    selected = new Set();
    optionButtons = [];

    typeTag.textContent = meta.label;
    typeHint.textContent = meta.hint;
    stemEl.textContent = current[1];
    resetFeedback();

    choiceArea.replaceChildren();
    choiceArea.hidden = true;
    fillArea.hidden = true;
    submitBtn.hidden = true;
    submitBtn.disabled = true;
    revealBtn.hidden = true;
    revealBtn.disabled = false;
    nextBtn.hidden = true;

    if (type === 0 || type === 1 || type === 2) {
      choiceArea.hidden = false;
      makeChoiceButtons(current[2]);
      submitBtn.hidden = false;
      submitBtn.textContent = '确认作答';
    } else if (type === 3) {
      fillArea.hidden = false;
      fillInput.disabled = false;
      fillInput.value = '';
      submitBtn.hidden = false;
      submitBtn.disabled = true;
      submitBtn.textContent = '确认作答';
      fillInput.style.height = '';
    } else {
      revealBtn.hidden = false;
      revealBtn.setAttribute('aria-label', '显示本题参考答案');
    }
  }

  function chooseOption(index) {
    if (locked) return;
    if (current[0] === 1) {
      if (selected.has(index)) selected.delete(index);
      else selected.add(index);
    } else {
      selected = new Set([index]);
    }
    optionButtons.forEach(function (button, i) {
      var active = selected.has(i);
      button.classList.toggle('selected', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    submitBtn.disabled = selected.size === 0;
  }

  function addFeedbackLine(text, className) {
    var line = document.createElement('div');
    line.className = className || 'feedback-line';
    line.textContent = text;
    feedback.appendChild(line);
  }

  function markCompleted() {
    if (completedThis) return;
    completedThis = true;
    completed += 1;
    counterEl.textContent = '已答 ' + completed + ' 题';
    nextBtn.hidden = false;
  }

  function correctAnswerText() {
    var order = current[3].slice().sort(function (a, b) { return a - b; });
    return order.map(function (i) {
      if (current[0] === 2) return LETTERS.charAt(i) + '（' + current[2][i] + '）';
      return LETTERS.charAt(i);
    }).join('、');
  }

  function submitChoice() {
    if (locked || !selected.size) return;
    locked = true;

    var correct = new Set(current[3]);
    var isCorrect = selected.size === correct.size;
    if (isCorrect) {
      selected.forEach(function (i) {
        if (!correct.has(i)) isCorrect = false;
      });
    }

    optionButtons.forEach(function (button, i) {
      button.disabled = true;
      button.classList.remove('selected');
      if (correct.has(i)) button.classList.add('correct');
      else if (selected.has(i)) button.classList.add('wrong');
      button.setAttribute('aria-pressed', selected.has(i) ? 'true' : 'false');
    });

    feedback.hidden = false;
    feedback.className = 'feedback ' + (isCorrect ? 'success' : 'error');
    var title = document.createElement('p');
    title.className = 'feedback-title';
    title.textContent = isCorrect ? '回答正确' : '回答错误';
    feedback.appendChild(title);
    addFeedbackLine('正确答案：' + correctAnswerText());

    if (!isCorrect) {
      var yourAnswer = Array.from(selected).sort(function (a, b) { return a - b; })
        .map(function (i) { return LETTERS.charAt(i); }).join('、');
      addFeedbackLine('你的选择：' + yourAnswer, 'feedback-line muted');
    }

    submitBtn.hidden = true;
    markCompleted();
  }

  function formatAnswerText(text) {
    return String(text || '').replace(/\|/g, ' / ').trim();
  }

  function showReferenceAnswer(kind) {
    var answer = formatAnswerText(current[2]);
    feedback.hidden = false;
    feedback.className = 'feedback info';

    var title = document.createElement('p');
    title.className = 'feedback-title';
    title.textContent = kind === 'fill' ? '参考答案' : '参考答案';
    feedback.appendChild(title);

    if (answer) {
      var answerEl = document.createElement('div');
      answerEl.className = 'feedback-answer';
      answerEl.textContent = answer;
      feedback.appendChild(answerEl);
    } else {
      addFeedbackLine('题库未提供本题的参考答案。');
      if (current[0] === 5) {
        addFeedbackLine('本题为开放性论述题，可结合相关资料自行思考作答。', 'feedback-line muted');
      }
    }
  }

  function submitFill() {
    if (locked || !fillInput.value.trim()) return;
    locked = true;
    fillInput.disabled = true;
    submitBtn.hidden = true;
    showReferenceAnswer('fill');
    markCompleted();
  }

  function revealAnswer() {
    if (locked) return;
    locked = true;
    revealBtn.hidden = true;
    showReferenceAnswer(current[0] === 4 ? 'short' : 'essay');
    markCompleted();
  }

  submitBtn.addEventListener('click', function () {
    if (!current) return;
    if (current[0] === 3) submitFill();
    else submitChoice();
  });

  fillInput.addEventListener('input', function () {
    if (!locked) submitBtn.disabled = fillInput.value.trim().length === 0;
  });

  fillInput.addEventListener('keydown', function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !submitBtn.disabled) {
      event.preventDefault();
      submitBtn.click();
    }
  });

  revealBtn.addEventListener('click', revealAnswer);

  nextBtn.addEventListener('click', function () {
    if (!completedThis) return;
    window.scrollTo(0, 0);
    drawQuestion();
  });

  drawQuestion();
})();
</script>
</body>
</html>
